<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soccer Substitution Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ========================= -->
  <!-- SCREEN 1: GAME SCREEN     -->
  <!-- ========================= -->
  <main id="gameScreen" class="screen">
    <header class="screen-header">
      <div class="left">
        <select id="teamSelect"></select>
        <button id="openTeamManager" class="btn small">Team Manager</button>
      </div>
      <div class="right">
        <span id="gameClock">00:00</span>
        <button id="startClockBtn" class="btn small">Start</button>
        <button id="pauseClockBtn" class="btn small">Pause</button>
        <button id="resetClockBtn" class="btn small">Reset</button>
      </div>
    </header>

    <section class="screen-content game-layout">
      <div class="field-container">
        <div id="field" class="field"></div>
      </div>

      <div class="bench-container">
        <div class="bench-header">Bench</div>
        <div id="bench" class="bench"></div>

        <div class="suggestions">
          <h3>Sub Suggestions</h3>
          <ul id="suggestionList"></ul>
        </div>
      </div>
    </section>

    <footer class="screen-footer"></footer>
  </main>

  <!-- ========================= -->
  <!-- SCREEN 2: TEAM MANAGER    -->
  <!-- ========================= -->
  <main id="teamManagerScreen" class="screen hidden">
    <header class="screen-header">
      <button id="backToGame" class="btn small">← Back</button>
      <h2>Team Manager</h2>
    </header>

    <section class="screen-content">
      <div class="team-meta card">
        <label>Team Name
          <input id="teamNameInput" type="text" />
        </label>

        <label>Formation
          <select id="formationInput">
            <option value="7v7-2-3-1">7v7: 2-3-1</option>
            <option value="9v9-3-3-2">9v9: 3-3-2</option>
            <option value="11v11-4-3-3">11v11: 4-3-3</option>
          </select>
        </label>

        <button id="addPlayerBtn" class="btn">+ Add Player</button>
      </div>

      <div class="roster-list card">
        <h3>Players</h3>
        <ul id="rosterList"></ul>
      </div>
    </section>

    <footer class="screen-footer">
      <button id="saveTeamBtn" class="btn">Save Team</button>
    </footer>
  </main>

  <!-- ========================= -->
  <!-- SCREEN 3: PLAYER EDITOR   -->
  <!-- ========================= -->
  <main id="playerEditorScreen" class="screen hidden">
    <header class="screen-header">
      <button id="backToTeamManager" class="btn small">← Back</button>
      <h2 id="playerEditorTitle">New Player</h2>
    </header>

    <section class="screen-content">
      <div class="player-editor card">

        <label>Name
          <input id="playerNameInput" type="text" />
        </label>

        <label>Number
          <input id="playerNumberInput" type="number" />
        </label>

        <label>Primary Positions (comma separated)
          <input id="playerPrimaryInput" type="text" placeholder="ST,RW,CAM" />
        </label>

        <label>Secondary Positions (comma separated)
          <input id="playerSecondaryInput" type="text" placeholder="LB,RB" />
        </label>

        <label>Tertiary Positions (comma separated)
          <input id="playerTertiaryInput" type="text" placeholder="CB" />
        </label>

        <label class="checkbox-row">
          <input id="playerTwoWayInput" type="checkbox" />
          <span>Can play offense & defense equally</span>
        </label>

        <label>Notes
          <textarea id="playerNotesInput"></textarea>
        </label>

      </div>
    </section>

    <footer class="screen-footer">
      <button id="savePlayerBtn" class="btn">Save Player</button>
      <button id="deletePlayerBtn" class="btn danger">Delete Player</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
