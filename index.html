<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soccer Substitution Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="app-header">
    <div class="header-left">
      <select id="teamSelect"></select>
      <button id="goToRosterBtn" class="btn small">Team Manager</button>
    </div>

    <div class="header-right">
      <span id="gameClock">00:00</span>
      <button id="startClockBtn" class="btn small">Start</button>
      <button id="pauseClockBtn" class="btn small">Pause</button>
      <button id="resetClockBtn" class="btn small">Reset</button>
    </div>
  </header>

  <!-- MAIN GAME VIEW -->
  <main id="mainView" class="app-main">
    <section class="field-container">
      <div id="field" class="field"></div>
    </section>

    <section class="bench-container">
      <div class="bench-header">
        <span>Bench</span>
      </div>
      <div id="bench" class="bench"></div>

      <div class="suggestions">
        <h3>Sub Suggestions</h3>
        <ul id="suggestionList"></ul>
      </div>
    </section>
  </main>

  <!-- TEAM MANAGER VIEW -->
  <main id="rosterView" class="roster-main hidden">
    <header class="roster-header">
      <button id="backToGameBtn" class="btn small">← Back to Game</button>
      <h2>Team Manager</h2>
    </header>

    <section class="roster-top">
      <div class="team-meta">
        <label>Team Name
          <input id="teamNameInput" type="text" />
        </label>

        <label>Formation
          <select id="formationInput">
            <option value="7v7-2-3-1">7v7: 2-3-1</option>
            <option value="9v9-3-3-2">9v9: 3-3-2</option>
            <option value="11v11-4-3-3">11v11: 4-3-3</option>
          </select>
        </label>
      </div>

      <button id="addPlayerBtn" class="btn">+ Add Player</button>
    </section>

    <section class="roster-content">
      <div class="roster-list">
        <h3>Players</h3>
        <ul id="rosterList"></ul>
      </div>

      <div class="player-editor">
        <h3 id="playerEditorTitle">New Player</h3>

        <label>Name
          <input id="playerNameInput" type="text" />
        </label>

        <label>Number
          <input id="playerNumberInput" type="number" />
        </label>

        <label>Primary Positions (comma separated)
          <input id="playerPrimaryInput" type="text" placeholder="ST,RW,CAM" />
        </label>

        <label>Secondary Positions (comma separated)
          <input id="playerSecondaryInput" type="text" placeholder="LB,RB" />
        </label>

        <label>Tertiary Positions (comma separated)
          <input id="playerTertiaryInput" type="text" placeholder="CB" />
        </label>

        <label class="checkbox-row">
          <input id="playerTwoWayInput" type="checkbox" />
          <span>Can play offense & defense equally</span>
        </label>

        <label>Notes
          <textarea id="playerNotesInput"></textarea>
        </label>

        <div class="player-editor-actions">
          <button id="savePlayerBtn" class="btn">Save Player</button>
          <button id="deletePlayerBtn" class="btn danger">Delete Player</button>
        </div>
      </div>
    </section>

    <footer class="roster-footer">
      <button id="saveRosterBtn" class="btn">Save Team</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
